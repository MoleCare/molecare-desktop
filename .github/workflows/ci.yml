name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  # Everything that does not need the renderer. Runs on every pull request,
  # including ones from forks -- which cannot see secrets and so can never
  # build the renderer. Without this split a fork PR has no green check at all.
  checks:
    name: Checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Check main process syntax
        run: for f in src/main/*.js; do node --check "$f"; done

  package:
    name: Package
    runs-on: macos-latest
    # The renderer comes from the private MoleCare/molecare-webapp, reached with
    # WEBAPP_READ_TOKEN. Secrets are not available to pull requests from forks,
    # so this job would always fail there. Skip it rather than fail it, and let
    # `checks` above carry the signal for outside contributors.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Check out the web app
        # The renderer is built from a separate repository. That repository is
        # currently private, so an unauthenticated clone fails with a bare
        # "could not read Username for 'https://github.com'" -- which reads like
        # a broken runner rather than a permissions problem, and fails every PR
        # including dependabot's.
        #
        # WEBAPP_READ_TOKEN is a fine-grained PAT with read access to
        # MoleCare/molecare-webapp. When it is absent the job says so plainly
        # and stops, instead of failing three steps later.
        env:
          WEBAPP_READ_TOKEN: ${{ secrets.WEBAPP_READ_TOKEN }}
        run: |
          if [ -n "$WEBAPP_READ_TOKEN" ]; then
            git clone --depth 1 \
              "https://x-access-token:${WEBAPP_READ_TOKEN}@github.com/MoleCare/molecare-webapp.git" \
              ../molecare-webapp
          elif git clone --depth 1 https://github.com/MoleCare/molecare-webapp.git ../molecare-webapp 2>/dev/null; then
            echo "Cloned molecare-webapp anonymously."
          else
            echo "::error::Cannot check out MoleCare/molecare-webapp. It is private and no WEBAPP_READ_TOKEN secret is set. Either make the repository public again, or add a fine-grained PAT with read access as WEBAPP_READ_TOKEN. See .github/workflows/README.md"
            exit 1
          fi

      - name: Build the renderer
        run: npm run build:webapp

      - name: Package (unsigned)
        # CSC_IDENTITY_AUTO_DISCOVERY=false keeps electron-builder from looking
        # for signing certificates that CI does not and should not have.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --dir --mac

      - name: Confirm the app was produced
        run: test -d dist/mac-*/MoleCare.app && echo "MoleCare.app built"

  sensitive-data:
    name: Sensitive data check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Block credential, key and signing files
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          HEAD="${{ github.event.pull_request.head.sha || github.sha }}"
          FILES=$(git diff --name-only --diff-filter=AM "$BASE" "$HEAD" || true)
          [ -z "$FILES" ] && { echo "No files to check."; exit 0; }
          BAD=$(echo "$FILES" | grep -iE '\.(pem|key|p12|pfx|mobileprovision)$|(^|/)\.env$' || true)
          if [ -n "$BAD" ]; then
            echo "::error::Credential or signing files must not be committed:"
            echo "$BAD" | sed 's/^/  /'
            exit 1
          fi
          echo "No credential file paths in this pull request."

      - name: Block embedded base64 blobs
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          HEAD="${{ github.event.pull_request.head.sha || github.sha }}"
          FAIL=0
          for f in $(git diff --name-only --diff-filter=AM "$BASE" "$HEAD" || true); do
            [ -f "$f" ] || continue
            case "$f" in *.lock|package-lock.json|*.svg|*.icns|*.ico|*.png) continue;; esac
            # A real patient photograph once reached a MoleCare repository as a
            # data: URI inside a source file, past every filename-based check.
            if grep -qE '[A-Za-z0-9+/]{512,}={0,2}' "$f"; then
              echo "::error file=$f::Long base64 blob detected. Do not embed binaries in source."
              FAIL=1
            fi
          done
          [ "$FAIL" -eq 0 ] && echo "No embedded base64 blobs." || exit 1
