name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  # Everything that does not need the renderer. Runs on every pull request,
  # including ones from forks -- which cannot see secrets and so can never
  # build the renderer. Without this split a fork PR has no green check at all.
  checks:
    name: Checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Check main process syntax
        run: for f in src/main/*.js; do node --check "$f"; done

      - name: Unit tests
        run: npm test

  package:
    name: Package
    runs-on: macos-latest
    # The renderer comes from the private MoleCare/molecare-webapp, reached with
    # the WEBAPP_DEPLOY_KEY secret. Secrets are not available to pull requests from forks,
    # so this job would always fail there. Skip it rather than fail it, and let
    # `checks` above carry the signal for outside contributors.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Check out the web app
        # The renderer is built from the private MoleCare/molecare-webapp. It is
        # read with a deploy key installed on that repository (read-only) whose
        # private half is this repository's WEBAPP_DEPLOY_KEY secret. No personal
        # token is involved. actions/checkout cannot write outside the workspace,
        # so the web app lands in a subfolder and build-webapp.sh is pointed at it.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: MoleCare/molecare-webapp
          ssh-key: ${{ secrets.WEBAPP_DEPLOY_KEY }}
          path: molecare-webapp
          persist-credentials: false

      - name: Build the renderer
        env:
          MOLECARE_WEBAPP_DIR: ${{ github.workspace }}/molecare-webapp
        run: npm run build:webapp

      - name: Package (unsigned)
        # CSC_IDENTITY_AUTO_DISCOVERY=false keeps electron-builder from looking
        # for signing certificates that CI does not and should not have.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --dir --mac

      - name: Confirm the app was produced
        run: test -d dist/mac-*/MoleCare.app && echo "MoleCare.app built"

  sensitive-data:
    name: Sensitive data check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Block credential, key and signing files
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          HEAD="${{ github.event.pull_request.head.sha || github.sha }}"
          FILES=$(git diff --name-only --diff-filter=AM "$BASE" "$HEAD" || true)
          [ -z "$FILES" ] && { echo "No files to check."; exit 0; }
          BAD=$(echo "$FILES" | grep -iE '\.(pem|key|p12|pfx|mobileprovision)$|(^|/)\.env$' || true)
          if [ -n "$BAD" ]; then
            echo "::error::Credential or signing files must not be committed:"
            echo "$BAD" | sed 's/^/  /'
            exit 1
          fi
          echo "No credential file paths in this pull request."

      - name: Block embedded base64 blobs
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          HEAD="${{ github.event.pull_request.head.sha || github.sha }}"
          FAIL=0
          for f in $(git diff --name-only --diff-filter=AM "$BASE" "$HEAD" || true); do
            [ -f "$f" ] || continue
            case "$f" in *.lock|package-lock.json|*.svg|*.icns|*.ico|*.png) continue;; esac
            # A real patient photograph once reached a MoleCare repository as a
            # data: URI inside a source file, past every filename-based check.
            if grep -qE '[A-Za-z0-9+/]{512,}={0,2}' "$f"; then
              echo "::error file=$f::Long base64 blob detected. Do not embed binaries in source."
              FAIL=1
            fi
          done
          [ "$FAIL" -eq 0 ] && echo "No embedded base64 blobs." || exit 1
